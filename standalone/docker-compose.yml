# Legacy standalone compatibility configuration, retained for existing deployments.
# Development and acceptance checks follow the host Quackit's DEVELOPMENT.md.
# Do not use this as an alternative to the Quackit port 80 verification path.
name: radio-logon
services:
  web:
    build:
      context: ..
      dockerfile: standalone/Dockerfile
    ports:
      - "8091:8091"
    environment:
      - RADIO_DB=mysql://radio:radio@db/radio
      - SECRET_KEY=change-me
      - TZ=Australia/Brisbane
      - RADIO_SHARED_TEMPLATES=/quackit-ui/templates
    volumes:
      - ${QUACKIT_UI_ROOT:?Set QUACKIT_UI_ROOT to the Quackit dflask directory}:/quackit-ui:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    command: --default-time-zone=+10:00
    environment:
      - MYSQL_ROOT_PASSWORD=radio-root
      - MYSQL_DATABASE=radio
      - MYSQL_USER=radio
      - MYSQL_PASSWORD=radio
    volumes:
      - radio_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  radio_db:
